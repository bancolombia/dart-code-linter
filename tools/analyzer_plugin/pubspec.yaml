name: dart_code_linter_analyzer_plugin_loader
description: This pubspec determines the version of the analyzer plugin to load.
version: 4.4.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  # Must stay pinned to this package's exact version: the analysis server
  # copies this pubspec verbatim and resolves it against pub.dev, so any range
  # lets the IDE silently load a different DCL than the one this loader shipped
  # in. Enforced by test/src/version_test.dart.
  dart_code_linter: 4.4.0
