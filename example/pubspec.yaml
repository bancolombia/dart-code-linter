name: flutter_example
description: Example app with DCL setup.

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  example_core:
    path: ./example_core
  dart_style: ">=3.1.3 <4.0.0"

dev_dependencies:
  #dart_code_linter: <USE-THE-LATEST-VERSION>
  dart_code_linter:
    path: ../

flutter:
  uses-material-design: true
