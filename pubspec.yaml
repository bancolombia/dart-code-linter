name: dart_code_linter
version: 4.2.1
description: Dart Code Linter is a software analytics tool that helps developers analyse and improve software quality. Dart Code Linter is based on a fork of Dart Code Metrics.
homepage: https://dcl.apps.bancolombia.com/
repository: https://github.com/bancolombia/dart-code-linter
issue_tracker: https://github.com/bancolombia/dart-code-linter/issues

environment:
  sdk: ">=3.5.0 <4.0.0"

platforms:
  linux:
  windows:
  macos:

dependencies:
  analysis_server_plugin: ^0.3.0
  analyzer: ">=10.0.0 <15.0.0"
  analyzer_plugin: ">=0.14.0 <0.16.0"
  ansicolor: ^2.0.1
  args: ^2.0.0
  collection: ^1.16.0
  crypto: ^3.0.0
  file: ">=6.0.0 <8.0.0"
  glob: ^2.0.1
  html: ^0.15.0
  http: ^1.1.0
  meta: ^1.7.0
  path: ^1.8.0
  platform: ^3.1.0
  pub_updater: ">=0.3.0 <0.6.0"
  source_span: ^1.9.0
  uuid: ^4.1.0
  xml: ">=6.6.0 <8.0.0"
  yaml: ^3.1.0

dev_dependencies:
  coverage: ^1.0.2
  intl: ">=0.17.0 <0.21.0"
  lints: ">=2.0.0 <7.0.0"
  mocktail: ">=0.3.0 <2.0.0"
  test: ">=1.21.0 <1.32.0"

  # internal package, used only in tests data
  test_lints:
    path: ./test/resources/test_lints

executables:
  metrics:
